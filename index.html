<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kina Studyjne w Polsce — mapa i ceny biletów</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#12100e; --panel:#1c1917; --panel2:#262220; --text:#f2ede6; --muted:#a89f93;
  --accent:#e6b34c; --accent2:#7fb069; --border:#38322d; --chip:#2e2a26;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:700}
header h1 span{color:var(--accent)}
header .sub{color:var(--muted);font-size:.8rem}
#controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
select,input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.85rem;outline:none}
input[type=text]{width:180px}
select:focus,input:focus{border-color:var(--accent)}
#main{flex:1;display:flex;min-height:0}
#list{width:420px;min-width:320px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);padding:10px}
#map{flex:1}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.card:hover,.card.active{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .name{font-weight:600;font-size:.95rem}
.card .city{color:var(--muted);font-size:.8rem;white-space:nowrap}
.card .prices{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:.75rem;color:var(--muted)}
.chip b{color:var(--text)}
.chip.min b{color:var(--accent2)}
.chip.shows b{color:var(--accent)}
.card .note{margin-top:5px;font-size:.72rem;color:var(--muted);font-style:italic}
.card .links{margin-top:6px;font-size:.75rem}
.card .links a{color:var(--accent);text-decoration:none;margin-right:10px}
.card .links a:hover{text-decoration:underline}
.unverified{opacity:.75}
.badge{font-size:.65rem;border:1px solid var(--border);border-radius:4px;padding:1px 4px;color:var(--muted);vertical-align:middle}
#stats{padding:6px 12px;font-size:.75rem;color:var(--muted)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2);color:var(--text)}
.leaflet-popup-content a{color:var(--accent)}
.leaflet-container{background:#0d0c0a}
footer{padding:6px 20px;background:var(--panel);border-top:1px solid var(--border);font-size:.7rem;color:var(--muted)}
footer a{color:var(--accent)}
@media(max-width:800px){
  #main{flex-direction:column}
  #list{width:100%;min-width:0;height:45%;order:2;border-right:none;border-top:1px solid var(--border)}
  #map{height:55%;order:1}
  input[type=text]{width:130px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎬 Kina <span>Studyjne</span> w Polsce</h1>
    <div class="sub">Sieć Kin Studyjnych — mapa, ceny biletów, seanse</div>
  </div>
  <div id="controls">
    <input type="text" id="search" placeholder="Szukaj kina lub miasta…">
    <select id="sort">
      <option value="priceMin">💰 Najtańszy bilet</option>
      <option value="priceNormal">🎟️ Bilet normalny</option>
      <option value="shows">🕐 Najwięcej seansów</option>
      <option value="city">🏙️ Miasto A–Z</option>
      <option value="name">🔤 Nazwa A–Z</option>
    </select>
    <select id="cityFilter"><option value="">Wszystkie miasta</option></select>
  </div>
</header>
<div id="stats"></div>
<div id="main">
  <div id="list"></div>
  <div id="map"></div>
</div>
<footer><span id="updated">Dane zebrane ze stron kin</span> — ceny mogą się zmieniać, sprawdź na stronie kina. Źródło listy: Sieć Kin Studyjnych / Stowarzyszenie Kin Studyjnych. <a href="https://github.com/sajgonara/kina-studyjne" target="_blank">GitHub</a></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const map = L.map('map').setView([52.1, 19.4], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

const markers = {};
const listEl = document.getElementById('list');
const sortEl = document.getElementById('sort');
const cityEl = document.getElementById('cityFilter');
const searchEl = document.getElementById('search');
const statsEl = document.getElementById('stats');

const fmt = v => v == null ? '—' : v.toFixed(2).replace(/\.00$/,'').replace('.',',') + ' zł';
const effMin = k => k.priceMin ?? k.priceDiscount ?? k.priceNormal;

// city filter options
[...new Set(KINA.map(k=>k.city))].sort((a,b)=>a.localeCompare(b,'pl')).forEach(c=>{
  const o=document.createElement('option'); o.value=c; o.textContent=c; cityEl.appendChild(o);
});

// markers
KINA.forEach((k,i)=>{
  if(k.lat==null||k.lng==null) return;
  const m=L.circleMarker([k.lat,k.lng],{radius:7,color:'#e6b34c',weight:1.5,fillColor:'#e6b34c',fillOpacity:.55});
  m.bindPopup(`<b>${k.name}</b><br>${k.city}${k.address?', '+k.address:''}<br>
    Normalny: <b>${fmt(k.priceNormal)}</b> · Ulgowy: <b>${fmt(k.priceDiscount)}</b>
    ${k.priceMin!=null?`<br>Najtaniej: <b style="color:#7fb069">${fmt(k.priceMin)}</b>`:''}
    ${k.priceNote?`<br><i style="font-size:.85em">${k.priceNote}</i>`:''}
    ${k.website?`<br><a href="${k.website}" target="_blank">strona</a>`:''}
    ${k.repertuarUrl?` · <a href="${k.repertuarUrl}" target="_blank">repertuar</a>`:''}`);
  m.on('click',()=>highlight(i,false));
  m.addTo(map); markers[i]=m;
});

function highlight(i,pan=true){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  const card=document.querySelector(`.card[data-i="${i}"]`);
  if(card){card.classList.add('active');card.scrollIntoView({block:'nearest',behavior:'smooth'});}
  const k=KINA[i];
  if(pan&&markers[i]){map.setView([k.lat,k.lng],13);markers[i].openPopup();}
}

function render(){
  const q=searchEl.value.trim().toLowerCase();
  const city=cityEl.value;
  const sort=sortEl.value;
  let items=KINA.map((k,i)=>({k,i}))
    .filter(({k})=>!city||k.city===city)
    .filter(({k})=>!q||k.name.toLowerCase().includes(q)||k.city.toLowerCase().includes(q));
  const val={priceMin:({k})=>effMin(k)??Infinity,
             priceNormal:({k})=>k.priceNormal??Infinity,
             shows:({k})=>-(k.showsPerDay??-1)};
  if(sort==='city') items.sort((a,b)=>a.k.city.localeCompare(b.k.city,'pl')||a.k.name.localeCompare(b.k.name,'pl'));
  else if(sort==='name') items.sort((a,b)=>a.k.name.localeCompare(b.k.name,'pl'));
  else items.sort((a,b)=>val[sort](a)-val[sort](b));

  listEl.innerHTML=items.map(({k,i})=>`
    <div class="card ${k.verified?'':'unverified'}" data-i="${i}">
      <div class="top"><span class="name">${k.name} ${k.verified?'':'<span class="badge" title="cena szacunkowa / nie potwierdzona na stronie kina">~cena</span>'}</span><span class="city">${k.city}</span></div>
      <div class="prices">
        <span class="chip min">od <b>${fmt(effMin(k))}</b></span>
        <span class="chip">norm. <b>${fmt(k.priceNormal)}</b></span>
        <span class="chip">ulg. <b>${fmt(k.priceDiscount)}</b></span>
        <span class="chip shows">seanse/dzień: <b>${k.showsPerDay??'—'}</b></span>
        ${k.screens?`<span class="chip">sale: <b>${k.screens}</b></span>`:''}
      </div>
      ${k.priceNote?`<div class="note">${k.priceNote}</div>`:''}
      <div class="links">
        ${k.website?`<a href="${k.website}" target="_blank">🌐 strona</a>`:''}
        ${k.repertuarUrl?`<a href="${k.repertuarUrl}" target="_blank">📅 repertuar</a>`:''}
      </div>
    </div>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>highlight(+c.dataset.i)));
  const withPrice=items.filter(({k})=>effMin(k)!=null);
  const avg=withPrice.length?withPrice.reduce((s,{k})=>s+effMin(k),0)/withPrice.length:0;
  statsEl.textContent=`${items.length} kin` + (withPrice.length?` · średnia cena „od": ${avg.toFixed(2).replace('.',',')} zł · najtaniej: ${fmt(Math.min(...withPrice.map(({k})=>effMin(k))))}`:'');
}
sortEl.addEventListener('change',render);
cityEl.addEventListener('change',render);
searchEl.addEventListener('input',render);
if(typeof KINA_UPDATED!=='undefined') document.getElementById('updated').textContent=`Dane ze stron kin, aktualizacja: ${KINA_UPDATED}`;
render();
</script>
</body>
</html>
